<!DOCTYPE html>
<html lang="my" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c9a227" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Jacob Saving</title>
<style>
  :root{
    --gold:#c9a227; --gold-2:#e8c14a; --gold-3:#f7dc6f; --gold-deep:#8b6914;
    --gold-line:rgba(201,162,39,.30);
    --green:#2e9e5b; --red:#d64545;
    --radius:16px;
    --shadow:0 8px 24px -12px rgba(201,162,39,.5);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  [data-theme="light"]{
    --bg-a:#fff7dd; --bg-b:#fff1c2; --bg-1:#fffdf7; --bg-2:#fbf5e6;
    --surface:#ffffff; --surface-2:#fdf9ee; --surface-3:#fffef9;
    --ink:#2b2415; --ink-2:#5c5238; --muted:#9a8f75;
    --hair:rgba(201,162,39,.16); --scrim:rgba(43,36,21,.5);
  }
  [data-theme="dark"]{
    --bg-a:#0e0a04; --bg-b:#14100a; --bg-1:#0f0d08; --bg-2:#15120a;
    --surface:#1a1610; --surface-2:#221d14; --surface-3:#1e1912;
    --ink:#f5edd6; --ink-2:#c9bc95; --muted:#8a8062;
    --hair:rgba(201,162,39,.20);
    --shadow:0 10px 30px -14px rgba(0,0,0,.7);
    --scrim:rgba(0,0,0,.72);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;overscroll-behavior-y:contain;}
  body{
    font-family:'Padauk','Myanmar Text','Noto Sans Myanmar',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:
      radial-gradient(circle at 8% -8%, var(--bg-a) 0%, transparent 48%),
      radial-gradient(circle at 96% 4%, var(--bg-b) 0%, transparent 45%),
      linear-gradient(170deg, var(--bg-1), var(--bg-2));
    background-attachment:fixed;
    color:var(--ink);
    padding:calc(10px + var(--safe-top)) 12px calc(120px + var(--safe-bottom));
    -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.5;
    transition:background .35s ease, color .35s ease;
  }
  html[lang="en"] body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;}
  .wrap{max-width:520px;margin:0 auto;}

  /* ===== HEADER ===== */
  header{display:flex;align-items:center;gap:12px;padding:4px 2px 12px;}

  /* ===== LOGO (image-based 3D animated) ===== */
  .logo-stage{
    position:relative;width:118px;height:128px;flex:0 0 auto;
    display:grid;place-items:center;
    perspective:900px;perspective-origin:50% 45%;
    margin-bottom:8px;
  }
  .aura{
    position:absolute;width:126px;height:126px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,214,82,.68) 0%, rgba(255,180,0,.22) 42%, transparent 72%);
    filter:blur(13px);
    animation:auraPulse 4s ease-in-out infinite;
  }
  @keyframes auraPulse{
    0%,100%{opacity:.72;transform:scale(.9)}
    50%{opacity:1;transform:scale(1.2)}
  }

  .ring{position:absolute;top:50%;left:50%;border-radius:50%;transform-style:preserve-3d;pointer-events:none;}
  .ring.r1{
    width:106px;height:106px;margin:-53px 0 0 -53px;
    border:1.5px solid rgba(201,162,39,.55);
    border-top-color:transparent;border-left-color:transparent;
    animation:spin1 6s linear infinite;
  }
  .ring.r2{
    width:128px;height:128px;margin:-64px 0 0 -64px;
    border:1px dashed rgba(201,162,39,.45);
    animation:spin2 11s linear infinite;
  }
  .ring.r3{
    width:92px;height:92px;margin:-46px 0 0 -46px;
    border:1px solid rgba(232,193,74,.65);
    border-bottom-color:transparent;border-right-color:transparent;
    animation:spin3 8s linear infinite reverse;
  }
  @keyframes spin1{from{transform:rotateX(74deg) rotateZ(0deg)}to{transform:rotateX(74deg) rotateZ(360deg)}}
  @keyframes spin2{from{transform:rotateX(66deg) rotateY(18deg) rotateZ(0deg)}to{transform:rotateX(66deg) rotateY(18deg) rotateZ(360deg)}}
  @keyframes spin3{from{transform:rotateX(80deg) rotateZ(0deg)}to{transform:rotateX(80deg) rotateZ(360deg)}}

  .orbit{position:absolute;top:0;left:0;width:100%;height:100%;transform-style:preserve-3d;pointer-events:none;}
  .orbit span{
    position:absolute;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #fff8d0, #ffd700 55%, #b8860b);
    box-shadow:0 0 9px rgba(255,215,0,.95), 0 0 18px rgba(255,180,0,.5);
  }
  .orbit.o1{animation:orbA 7s linear infinite;}
  .orbit.o1 span{transform:translateX(58px) translateZ(9px);}
  .orbit.o2{animation:orbB 9.5s linear infinite;}
  .orbit.o2 span{transform:translateX(50px) translateZ(-11px);width:5px;height:5px;}
  .orbit.o3{animation:orbC 5.5s linear infinite;}
  .orbit.o3 span{transform:translateX(64px);width:4px;height:4px;}
  @keyframes orbA{from{transform:rotateX(72deg) rotateZ(0deg)}to{transform:rotateX(72deg) rotateZ(360deg)}}
  @keyframes orbB{from{transform:rotateX(62deg) rotateY(22deg) rotateZ(360deg)}to{transform:rotateX(62deg) rotateY(22deg) rotateZ(0deg)}}
  @keyframes orbC{from{transform:rotateX(82deg) rotateZ(0deg)}to{transform:rotateX(82deg) rotateZ(-360deg)}}

  .logo-3d-wrap{
    position:relative;width:94px;height:104px;
    transform-style:preserve-3d;
    animation:swingLogo 6.5s ease-in-out infinite;
    will-change:transform;
    z-index:2;
  }
  @keyframes swingLogo{
    0%   {transform:rotateY(-26deg) rotateX(8deg) translateY(0)    scale(1);}
    25%  {transform:rotateY(0deg)   rotateX(0deg) translateY(-4px) scale(1.03);}
    50%  {transform:rotateY(26deg)  rotateX(-8deg) translateY(-6px) scale(1.05);}
    75%  {transform:rotateY(0deg)   rotateX(0deg) translateY(-4px) scale(1.03);}
    100% {transform:rotateY(-26deg) rotateX(8deg) translateY(0)    scale(1);}
  }
  .logo-img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:contain;
    user-select:none;-webkit-user-drag:none;
    filter:
      drop-shadow(0 8px 16px rgba(201,162,39,.6))
      drop-shadow(0 0 20px rgba(255,200,20,.4));
  }

  .logo-reflection{
    position:absolute;left:0;right:0;bottom:-52px;
    width:100%;height:46px;
    object-fit:contain;object-position:top;
    transform:scaleY(-1);
    opacity:.28;
    filter:blur(4px) saturate(.75);
    -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.95) 0%, transparent 90%);
    mask-image:linear-gradient(to bottom, rgba(0,0,0,.95) 0%, transparent 90%);
    pointer-events:none;
    z-index:1;
  }

  .floor-glow{
    position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
    width:92px;height:14px;border-radius:50%;
    background:radial-gradient(ellipse, rgba(201,162,39,.6), transparent 72%);
    filter:blur(6px);
    animation:floorPulse 4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes floorPulse{
    0%,100%{opacity:.6;transform:translateX(-50%) scaleX(1);}
    50%{opacity:1;transform:translateX(-50%) scaleX(1.15);}
  }

  .brand{flex:1;min-width:0;}
  .brand h1{font-size:22px;letter-spacing:.3px;font-weight:800;
    background:linear-gradient(90deg,#8b6914,#d4a017 30%,#ffd700 55%,#c9a227 80%,#8b6914);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 5s linear infinite;}
  @keyframes shimmer{from{background-position:0% 0}to{background-position:200% 0}}
  .brand p{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.4;}

  .cloud-status{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:20px;margin-top:5px;
    background:rgba(201,162,39,.12);
    border:1px solid var(--gold-line);
    font-size:10.5px;font-weight:700;color:var(--muted);
    transition:background .3s ease, color .3s ease;
  }
  .cloud-status .dot{width:6px;height:6px;border-radius:50%;background:#ffc107;
    box-shadow:0 0 6px currentColor;animation:blink 1.5s ease-in-out infinite;}
  .cloud-status.online .dot{background:var(--green);animation:none;}
  .cloud-status.online{color:var(--green);background:rgba(46,158,91,.12);border-color:rgba(46,158,91,.3);}
  .cloud-status.offline .dot{background:#ff9800;animation:none;}
  .cloud-status.offline{color:#ff9800;background:rgba(255,152,0,.12);border-color:rgba(255,152,0,.3);}
  .cloud-status.error .dot{background:var(--red);animation:none;}
  .cloud-status.error{color:var(--red);background:rgba(214,69,69,.12);border-color:rgba(214,69,69,.3);}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

  .icon-btn{
    width:40px;height:40px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(160deg,var(--surface),var(--surface-2));
    border:1px solid var(--gold-line);color:var(--gold-deep);font-size:18px;
    cursor:pointer;display:grid;place-items:center;transition:.15s;
    box-shadow:0 3px 10px -6px rgba(201,162,39,.6);
    font-weight:800;
  }
  .icon-btn:active{transform:scale(.92);}
  #langBtn{font-size:11px;letter-spacing:.4px;}

  .card{background:var(--surface);border:1px solid var(--gold-line);border-radius:var(--radius);
    padding:14px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    transition:background .35s ease, border-color .35s ease;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;
    background:linear-gradient(90deg,transparent,var(--gold-3),var(--gold),var(--gold-3),transparent);opacity:.75;}
  .month-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .mbtn{width:46px;height:46px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(160deg,var(--surface),var(--surface-2));
    border:1px solid var(--gold-line);color:var(--gold-deep);font-size:22px;font-weight:700;
    cursor:pointer;display:grid;place-items:center;transition:.15s;
    box-shadow:0 3px 10px -6px rgba(201,162,39,.6);}
  .mbtn:active:not(:disabled){transform:scale(.94);background:var(--surface-3);}
  .mbtn:disabled{opacity:.3;cursor:not-allowed;}
  .mcenter{text-align:center;flex:1;min-width:0;}
  .mcenter .mname{font-size:18px;font-weight:800;letter-spacing:.2px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mcenter .badge{display:inline-block;margin-top:4px;font-size:10.5px;padding:2px 11px;border-radius:20px;
    background:linear-gradient(135deg, rgba(255,215,0,.28), rgba(232,193,74,.16));
    color:var(--gold-deep);border:1px solid var(--gold-line);font-weight:700;}
  .mcenter .badge.old{background:rgba(154,143,117,.14);color:var(--muted);border-color:rgba(154,143,117,.25);}

  .stats{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px;}
  .stat{background:linear-gradient(165deg,var(--surface) 0%,var(--surface-2) 100%);
    border:1px solid var(--gold-line);border-radius:14px;padding:12px 16px;
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;
    gap:10px;position:relative;overflow:hidden;}
  .stat::after{content:'';position:absolute;top:-40%;right:-20%;width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,215,0,.22),transparent 70%);pointer-events:none;}
  .stat .lbl{font-size:13px;color:var(--muted);font-weight:700;flex:1;min-width:0;}
  .stat .val{font-size:19px;font-weight:800;letter-spacing:.3px;color:var(--ink);flex:0 0 auto;}
  .stat .val.gold{background:linear-gradient(180deg,#d4a017,#8b6914);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat .val.green{color:var(--green);}
  .stat .unit{font-size:11px;color:var(--muted);font-weight:600;margin-left:2px;}

  .insight{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;}
  .streak-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:10px 14px;border-radius:14px;min-width:74px;
    background:linear-gradient(160deg, rgba(255,215,0,.20), rgba(232,193,74,.06));
    border:1px solid var(--gold-line);text-align:center;}
  .streak-badge .flame{font-size:24px;line-height:1;filter:drop-shadow(0 0 8px rgba(255,140,0,.7));}
  .streak-badge .num{font-size:20px;font-weight:900;color:var(--gold-deep);line-height:1.1;margin-top:2px;}
  [data-theme="dark"] .streak-badge .num{color:var(--gold-3);}
  .streak-badge .unit{font-size:10px;color:var(--muted);font-weight:700;}

  .chart{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:end;height:64px;}
  .chart .day{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;}
  .chart .day .bar{width:100%;max-width:26px;min-height:3px;border-radius:5px;
    background:linear-gradient(180deg,var(--gold-3),var(--gold));transition:height .5s cubic-bezier(.2,.8,.2,1);position:relative;}
  .chart .day.neg .bar{background:linear-gradient(180deg,#ffa7a7,var(--red));}
  .chart .day.today .bar{box-shadow:0 0 10px rgba(255,215,0,.9);}
  .chart .day .lab{font-size:9.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .chart .day.today .lab{color:var(--gold-deep);}

  .goal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .goal-head .t{font-size:14px;font-weight:800;color:var(--ink);}
  .goal-input{background:linear-gradient(180deg,var(--surface-3),var(--surface-2));
    border:1px solid var(--gold-line);border-radius:10px;
    padding:8px 12px;color:var(--ink);width:130px;font-size:16px;text-align:right;
    font-family:inherit;font-weight:700;transition:.2s;-webkit-appearance:none;}
  .goal-input::placeholder{color:var(--muted);font-weight:500;font-size:13px;}
  .goal-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18);}
  .bar{height:12px;border-radius:20px;background:var(--surface-2);border:1px solid rgba(201,162,39,.18);overflow:hidden;}
  .bar > i{display:block;height:100%;width:0%;border-radius:20px;
    background:linear-gradient(90deg,#b8860b,#d4a017 30%,#ffd700 60%,#ffe98a);
    background-size:200% 100%;transition:width .6s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 0 14px rgba(255,183,3,.7);animation:flow 3s linear infinite;}
  @keyframes flow{from{background-position:0% 0}to{background-position:200% 0}}
  .goal-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;font-weight:600;}
  .goal-foot #goalPct{color:var(--gold-deep);font-weight:800;}
  [data-theme="dark"] .goal-foot #goalPct{color:var(--gold-3);}

  .searchbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .search-wrap{position:relative;flex:1;display:flex;}
  .search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.65;pointer-events:none;z-index:1;}
  .search-input{flex:1;background:var(--surface);border:1px solid var(--gold-line);border-radius:12px;
    padding:10px 12px 10px 38px;color:var(--ink);font-size:15px;font-family:inherit;transition:.2s;width:100%;}
  .search-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18);}
  .filter-chips{display:flex;gap:5px;flex:0 0 auto;}
  .fchip{padding:10px 12px;border-radius:12px;font-size:12.5px;font-weight:800;
    background:var(--surface);border:1px solid var(--gold-line);color:var(--muted);
    cursor:pointer;transition:.15s;font-family:inherit;}
  .fchip.on{background:linear-gradient(180deg,#fff8dc,#f7e7a8);border-color:var(--gold);color:var(--gold-deep);}
  [data-theme="dark"] .fchip.on{background:linear-gradient(180deg, rgba(255,215,0,.22), rgba(232,193,74,.10));color:var(--gold-3);}
  .fchip:active{transform:scale(.94);}

  .list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;}
  .list-head h2{font-size:15px;font-weight:800;color:var(--ink);}
  .list-head span{font-size:11.5px;color:var(--muted);font-weight:600;}

  .list-wrap{position:relative;overflow:hidden;border-radius:14px;margin-bottom:8px;}
  .item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;
    background:linear-gradient(180deg,var(--surface-3),var(--surface-2));
    border:1px solid var(--hair);
    transition:transform .25s cubic-bezier(.2,.8,.2,1), background .35s ease, border-color .35s ease;
    position:relative;z-index:2;will-change:transform;touch-action:pan-y;}
  .item.swiped{transition:transform .3s cubic-bezier(.2,.8,.2,1);}
  .item .ico{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(160deg,#fff8dc,#f7e7a8);border:1px solid var(--gold-line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9);}
  [data-theme="dark"] .item .ico{background:linear-gradient(160deg,#2a2317,#1e1912);}
  .item .meta{flex:1;min-width:0;}
  .item .note{font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .date{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600;}
  .item .amt{font-size:15.5px;font-weight:800;white-space:nowrap;}
  .amt.in{color:var(--green);} .amt.out{color:var(--red);}
  .acts{display:flex;gap:4px;flex:0 0 auto;}
  .acts button{width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:15px;
    background:var(--surface);border:1px solid var(--gold-line);
    display:grid;place-items:center;transition:.15s;}
  .acts .edit:active{transform:scale(.92);background:#f7e7a8;}
  .acts .del:active{transform:scale(.92);background:#ffe0e0;}
  .swipe-bg{position:absolute;inset:0;border-radius:14px;
    background:linear-gradient(90deg, transparent 40%, var(--red));
    display:flex;align-items:center;justify-content:flex-end;
    padding-right:22px;color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px;}
  .empty{text-align:center;padding:34px 12px;color:var(--muted);font-size:13.5px;line-height:1.8;}
  .empty .big{font-size:42px;display:block;margin-bottom:10px;filter:drop-shadow(0 4px 10px rgba(201,162,39,.4));}

  .fab{position:fixed;right:18px;bottom:calc(22px + var(--safe-bottom));
    width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,#ffe98a 0%,#ffd700 40%,#d4a017 100%);
    color:#3a2a05;font-size:30px;font-weight:800;display:grid;place-items:center;
    box-shadow:0 12px 30px -8px rgba(201,162,39,.9),0 6px 14px -6px rgba(139,105,20,.7),inset 0 2px 0 rgba(255,255,255,.65);
    z-index:60;transition:transform .2s cubic-bezier(.2,1.4,.4,1);}
  .fab:active{transform:scale(.9) rotate(90deg);}
  .fab::before{content:'';position:absolute;inset:-6px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,215,0,.35), transparent 70%);
    animation:fabPulse 2.4s ease-in-out infinite;z-index:-1;}
  @keyframes fabPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}

  .sheet-bg{position:fixed;inset:0;background:var(--scrim);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:80;}
  .sheet-bg.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
    border-top-left-radius:22px;border-top-right-radius:22px;
    border-top:2px solid var(--gold-2);
    padding:16px 16px calc(18px + var(--safe-bottom));
    transform:translateY(110%);transition:transform .38s cubic-bezier(.25,1,.3,1), background .35s ease;
    z-index:90;max-height:94vh;overflow-y:auto;
    box-shadow:0 -14px 40px -12px rgba(139,105,20,.35);}
  .sheet.open{transform:translateY(0);}
  .sheet .grip{width:44px;height:5px;border-radius:20px;background:linear-gradient(90deg,#e8c14a,#c9a227);margin:0 auto 12px;opacity:.55;}
  .sheet-title{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:14px;text-align:center;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .sheet-title .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#ffd700,#8b6914);box-shadow:0 0 8px rgba(255,215,0,.8);}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field label{font-size:12.5px;color:var(--muted);font-weight:700;}
  .field input,.field select{background:linear-gradient(180deg,var(--surface-3),var(--surface-2));
    border:1px solid var(--gold-line);border-radius:12px;
    padding:14px;color:var(--ink);font-size:16px;font-family:inherit;

let firestore = null;
let status = 'connecting';
const $ = id => document.getElementById(id);

function setStatus(s, msg){
  status = s;
  const el = $('cloudStatus');
  el.className = 'cloud-status ' + s;
  const txt = el.querySelector('.txt');
  const fallback = {
    connecting: t('statusConnecting'),
    online:     t('statusOnline'),
    offline:    t('statusOffline'),
    error:      t('statusError')
  };
  txt.textContent = msg || fallback[s] || s;
}

try{
  const app = initializeApp(firebaseConfig);
  firestore = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
}catch(e){
  console.error('Firebase init failed:', e);
  setStatus('error');
}

if (firestore) bootstrapCloud();

async function bootstrapCloud(){
  setStatus('connecting', t('statusFetching'));
  try{
    const metaRef = doc(firestore, 'users', deviceId, 'meta', 'root');
    const metaSnap = await getDoc(metaRef);

    if (!metaSnap.exists()){
      await setDoc(metaRef, { createdAt: Date.now(), deviceId });
      if (db.entries.length || Object.keys(db.goals).length){
        await migrateLocalToCloud();
      }
    }
    attachEntryListener();
    attachGoalListener();
    setStatus('online');
  }catch(e){
    console.error('Bootstrap failed:', e);
    setStatus('offline');
  }
}

async function migrateLocalToCloud(){
  if (!db.entries.length && !Object.keys(db.goals).length) return;
  setStatus('connecting', t('statusUploading'));
  try{
    const batch = writeBatch(firestore);
    for (const e of db.entries){
      const ref = doc(firestore, 'users', deviceId, 'entries', e.id);
      const { id, ...rest } = e;
      batch.set(ref, rest);
    }
    const goalsRef = doc(firestore, 'users', deviceId, 'meta', 'goals');
    batch.set(goalsRef, { data: db.goals });
    await batch.commit();
    toast(t('toastMigrated'));
  }catch(e){
    console.error('Migration failed:', e);
    toast(t('toastMigrateFail'));
  }
}

let unsubEntries = null, unsubGoals = null;
function attachEntryListener(){
  if (unsubEntries) unsubEntries();
  const col = collection(firestore, 'users', deviceId, 'entries');
  unsubEntries = onSnapshot(col,
    (snap) => {
      const entries = [];
      snap.forEach(d => entries.push({ ...d.data(), id: d.id }));
      db.entries = entries;
      cacheLocal();
      render();
      if (status !== 'online') setStatus('online');
    },
    (err) => { console.warn(err); setStatus('offline'); }
  );
}
function attachGoalListener(){
  if (unsubGoals) unsubGoals();
  const ref = doc(firestore, 'users', deviceId, 'meta', 'goals');
  unsubGoals = onSnapshot(ref,
    (snap) => {
      db.goals = snap.exists() ? (snap.data().data || {}) : {};
      cacheLocal();
      renderGoal();
    },
    (err) => console.warn(err)
  );
}

async function cloudAdd(entry){
  const ref = doc(firestore, 'users', deviceId, 'entries', entry.id);
  const { id, ...rest } = entry;
  await setDoc(ref, rest);
}
async function cloudUpdate(id, patch){
  await setDoc(doc(firestore, 'users', deviceId, 'entries', id), patch, { merge: true });
}
async function cloudDelete(id){
  await deleteDoc(doc(firestore, 'users', deviceId, 'entries', id));
}
async function cloudRestore(entry){
  const ref = doc(firestore, 'users', deviceId, 'entries', entry.id);
  const { id, ...rest } = entry;
  await setDoc(ref, rest);
}
async function cloudSetGoals(goals){
  await setDoc(doc(firestore, 'users', deviceId, 'meta', 'goals'), { data: goals });
}
async function cloudClearAll(){
  const col = collection(firestore, 'users', deviceId, 'entries');
  const snap = await getDocs(col);
  const batch = writeBatch(firestore);
  snap.forEach(d => batch.delete(d.ref));
  batch.delete(doc(firestore, 'users', deviceId, 'meta', 'goals'));
  await batch.commit();
}

function entriesForMonth(key){
  return db.entries
    .filter(e => e.date.slice(0,7) === key)
    .sort((a,b) => b.date.localeCompare(a.date) || (b.created||0) - (a.created||0));
}

const lastVals = { sMonthNum:null, sTotalNum:null, sCountNum:null };
function animNum(el, target){
  const prev = lastVals[el.id] ?? 0;
  lastVals[el.id] = target;
  const start = performance.now();
  const diff  = target - prev;
  const dur   = 650;
  if (Math.abs(diff) < 0.5){ el.textContent = fmt(target); return; }
  function step(ts){
    const p = Math.min(1, (ts - start) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(prev + diff * e);
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = fmt(target);
  }
  requestAnimationFrame(step);
}

function renderStats(){
  const list = entriesForMonth(viewMonth);
  let inS = 0, outS = 0;
  list.forEach(e => e.type === 'in' ? inS += e.amount : outS += e.amount);
  const monthNet = inS - outS;
  let total = 0;
  db.entries.forEach(e => e.type === 'in' ? total += e.amount : total -= e.amount);
  animNum($('sMonthNum'), monthNet);
  animNum($('sTotalNum'), total);
  animNum($('sCountNum'), list.length);
  $('listCount').textContent = `${list.length} ${t('listCountUnit')}`;
}

function calcStreak(){
  const days = new Set(db.entries.map(e => e.date));
  let s = 0;
  const d = new Date();
  if (!days.has(dateStr(d))) d.setDate(d.getDate() - 1);
  while (days.has(dateStr(d))){ s++; d.setDate(d.getDate() - 1); }
  return s;
}

function renderStreakAndChart(){
  $('streakNum').textContent = calcStreak();
  const days = [];
  const today = new Date();
  for (let i = 6; i >= 0; i--){
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const ds = dateStr(d);
    let net = 0;
    db.entries.forEach(e => { if (e.date === ds) net += (e.type === 'in' ? e.amount : -e.amount); });
    days.push({ date: d, key: ds, net, isToday: i === 0 });
  }
  const maxAbs = Math.max(1, ...days.map(d => Math.abs(d.net)));
  $('chart').innerHTML = days.map(d => {
    const pct = Math.abs(d.net) / maxAbs;
    const h   = Math.max(3, pct * 44);
    const cls = ['day'];
    if (d.net < 0) cls.push('neg');
    if (d.isToday) cls.push('today');
    const lbl = t('days')[d.date.getDay()].slice(0, LANG === 'en' ? 3 : 2);
    return `<div class="${cls.join(' ')}">
      <div class="bar" style="height:${h}px"></div>
      <div class="lab">${lbl}</div>
    </div>`;
  }).join('');
}

let lastGoalReached = false;
function renderGoal(){
  const goal = Number(db.goals[viewMonth] || 0);
  $('goalInput').value = goal > 0 ? goal : '';
  const list = entriesForMonth(viewMonth);
  let net = 0;
  list.forEach(e => e.type === 'in' ? net += e.amount : net -= e.amount);
  if (goal <= 0){
    $('goalBar').style.width = '0%';
    $('goalPct').textContent = '0%';
    $('goalLeft').textContent = t('goalSetPrompt');
    lastGoalReached = false;
    return;
  }
  const pct = Math.max(0, Math.min(100, (net / goal) * 100));
  $('goalBar').style.width = pct + '%';
  $('goalPct').textContent = pct.toFixed(1) + '%';
  const left = goal - net;
  $('goalLeft').textContent = left > 0
    ? t('goalRemaining', fmt(left))
    : t('goalReached', fmt(-left));
  const reached = net >= goal;
  if (reached && !lastGoalReached && viewMonth === monthKey(new Date())){
    burstConfetti();
    haptic([12,60,12,60,12]);
  }
  lastGoalReached = reached;
}

  }

    const isFiltered = searchQ || filter !== 'all';
    box.innerHTML = `<div class="empty"><span class="big">🪙</span>${
      isFiltered ? t('emptyFiltered') : t('emptyNoData')

    return;

  box.innerHTML = list.map(e => {
    const isIn = e.type === 'in';
    const cat  = catMap[e.cat] || { emoji: isIn ? '💰' : '💸' };
    const note = escapeHtml(e.note || (isIn ? t('defaultNoteIn') : t('defaultNoteOut')));
    return `<div class="list-wrap">
      <div class="swipe-bg">${t('swipeDelete')}</div>
      <div class="item" data-id="${e.id}">
        <div class="ico">${cat.emoji}</div>
        <div class="meta">
          <div class="note">${note}</div>
          <div class="date">${prettyDate(e.date)}</div>
        </div>
        <div class="amt ${isIn ? 'in' : 'out'}">${isIn ? '+' : '−'}${fmt(e.amount)}</div>
        <div class="acts">
          <button class="edit" data-act="edit" aria-label="Edit">✏️</button>
          <button class="del"  data-act="del"  aria-label="Delete">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* =========================================================
   11) SEARCH + FILTER
   ========================================================= */
$('searchInput').addEventListener('input', e => { searchQ = e.target.value.trim(); renderList(); });
document.querySelectorAll('.fchip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.fchip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');

    haptic(8);
    renderList();

/* =========================================================
   12) SHEET
   ========================================================= */
const sheet = $('sheet'), sheetBg = $('sheetBg');
function openSheet(edit){
  $('formTitleText').textContent = edit ? t('formEditTitle') : t('formAddTitle');
  $('submitBtn').textContent     = edit ? t('btnUpdate') : t('btnSave');
  sheet.classList.add('open');
  sheetBg.classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => $('fAmount').focus(), 350);
}
function closeSheet(){
  sheet.classList.remove('open');
  sheetBg.classList.remove('open');
  document.body.style.overflow = '';
}
$('fab').addEventListener('click', () => {
  haptic(10);
  if (editingId) exitEditMode();
  resetForm();
  selectedCat = 'money';
  renderCategories();
  openSheet(false);
});
sheetBg.addEventListener('click', closeSheet);
$('cancelBtn').addEventListener('click', () => { if (editingId) exitEditMode(); closeSheet(); });

(function(){
  let sy = 0, cy = 0, drag = false;
  sheet.addEventListener('touchstart', e => {
    const grip = e.target.closest('.grip') || e.target.closest('.sheet-title');
    if (!grip && sheet.scrollTop > 0) return;
    sy = cy = e.touches[0].clientY; drag = true;
    sheet.style.transition = 'none';
  }, { passive:true });
  sheet.addEventListener('touchmove', e => {
    if (!drag) return;
    cy = e.touches[0].clientY;
    const dy = Math.max(0, cy - sy);
    sheet.style.transform = `translateY(${dy}px)`;
  }, { passive:true });
  sheet.addEventListener('touchend', () => {
    if (!drag) return;
    drag = false;
    sheet.style.transition = '';
    sheet.style.transform  = '';
    if (cy - sy > 90) closeSheet();
  });
})();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (sheet.classList.contains('open')) closeSheet();
    $('menu').classList.remove('open');
  }
});

/* =========================================================
   13) QUICK CHIPS + CATEGORIES
   ========================================================= */
$('quickRow').addEventListener('click', e => {
  const b = e.target.closest('.qchip'); if (!b) return;
  const cur = Number($('fAmount').value) || 0;
  $('fAmount').value = cur + Number(b.dataset.add);
  haptic(6);
});

function renderCategories(){
  $('catRow').innerHTML = CATEGORIES.map(c => `
    <button type="button" class="cat${c.id === selectedCat ? ' on' : ''}" data-cat="${c.id}" aria-label="${catName(c.id)}">
      <span>${c.emoji}</span><span class="nm">${catName(c.id)}</span>
    </button>`).join('');
}
$('catRow').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b) return;
  selectedCat = b.dataset.cat;
  haptic(6);
  renderCategories();
});

/* =========================================================
   14) FORM SUBMIT
   ========================================================= */
const form = $('entryForm');
form.addEventListener('submit', async ev => {
  ev.preventDefault();
  const amount = Number($('fAmount').value);
  const date   = $('fDate').value;
  const type   = document.querySelector('input[name="fType"]:checked').value;
  const note   = $('fNote').value.trim();

  if (!amount || amount <= 0){ toast(t('toastAmountInvalid')); return; }
  if (!date){ toast(t('toastDateRequired')); return; }
  if (!firestore){ toast(t('toastNoCloud')); return; }

  const btn = $('submitBtn');
  const wasEditing = !!editingId;
  btn.disabled = true;
  btn.textContent = t('btnSaving');

  try{
    if (editingId){
      await cloudUpdate(editingId, { amount, date, type, note, cat: selectedCat });
      toast(t('toastUpdated'));
      haptic(15);
      exitEditMode();
    } else {
      const entry = {
        id: 'e' + Date.now() + Math.random().toString(36).slice(2,7),
        amount, date, type, note, cat: selectedCat, created: Date.now()
      };
      db.entries.push(entry);
      cacheLocal();
      render();
      await cloudAdd(entry);
      toast(t('toastSaved'));
      haptic(15);
    }
    const em = date.slice(0,7);
    if (em !== viewMonth) viewMonth = em;
    resetForm();
    render();
    closeSheet();
  }catch(e){
    console.error(e);
    toast(t('toastSaveFail'));
  }finally{
    btn.disabled = false;
    btn.textContent = wasEditing ? t('btnUpdate') : t('btnSave');
  }
});

function resetForm(){
  $('fAmount').value = '';
  $('fNote').value = '';
  $('fDate').value = dateStr(new Date());
  $('tIn').checked = true;
}
function enterEditMode(id){
  const e = db.entries.find(x => x.id === id); if (!e) return;
  editingId = id;
  $('fAmount').value = e.amount;
  $('fDate').value   = e.date;
  $('fNote').value   = e.note || '';
  if (e.type === 'out') $('tOut').checked = true; else $('tIn').checked = true;
  selectedCat = e.cat || 'money';
  renderCategories();
  openSheet(true);
}
function exitEditMode(){ editingId = null; resetForm(); }

/* =========================================================
   15) DELETE + UNDO + SWIPE
   ========================================================= */
let pendingDelete = null;

async function deleteEntry(id){
  const i = db.entries.findIndex(x => x.id === id);
  if (i < 0) return;
  const backup = { ...db.entries[i] };
  db.entries.splice(i, 1);
  cacheLocal();
  render();
  if (editingId === id) exitEditMode();
  try{
    await cloudDelete(id);
  }catch(e){
    console.error(e);
    db.entries.push(backup);
    cacheLocal();
    render();
    toast(t('toastDeleteFail'));
    return;
  }
  pendingDelete = backup;
  showUndoToast(t('toastDeleted'), async () => {
    if (!pendingDelete) return;
    try{
      await cloudRestore(pendingDelete);
      toast(t('toastRestored'));
    }catch(e){ toast(t('toastRestoreFail')); }
    pendingDelete = null;
  });
}

$('listBox').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = b.closest('.item').dataset.id;
  const act = b.dataset.act;
  if (act === 'edit'){ haptic(10); enterEditMode(id); }
  if (act === 'del'){
    const item = db.entries.find(x => x.id === id);
    if (!item) return;
    haptic(20);
    const typeLabel = item.type === 'in' ? t('typeInLabel') : t('typeOutLabel');
    if (confirm(t('confirmDelete', typeLabel, fmt(item.amount), prettyDate(item.date)))){
      deleteEntry(id);
    }
  }
});

(function swipeDelegation(){
  let startX = 0, startY = 0, curItem = null, swiping = false, locked = false;
  const list = $('listBox');
  list.addEventListener('touchstart', e => {
    const it = e.target.closest('.item');
    if (!it || e.touches.length !== 1) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    curItem = it; swiping = true; locked = false;
  }, { passive:true });
  list.addEventListener('touchmove', e => {
    if (!swiping || !curItem) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (!locked){
      if (Math.abs(dy) > Math.abs(dx)){ swiping = false; curItem = null; return; }
      locked = true;
    }
    if (dx < 0){
      const shift = Math.max(-110, dx);
      curItem.classList.remove('swiped');
      curItem.style.transform = `translateX(${shift}px)`;
      if (Math.abs(shift) > 5) e.preventDefault();
    }
  }, { passive:false });
  list.addEventListener('touchend', e => {
    if (!curItem){ swiping = false; return; }
    const dx = e.changedTouches[0].clientX - startX;
    const it = curItem;
    curItem = null; swiping = false;
    it.classList.add('swiped');
    if (dx < -80){
      it.style.transform = 'translateX(-110px)';
      haptic(25);
      setTimeout(() => { deleteEntry(it.dataset.id); }, 180);
    } else {
      it.style.transform = 'translateX(0)';
    }
  });
})();

/* =========================================================
   16) MONTH NAV
   ========================================================= */
$('prevM').addEventListener('click', () => shiftMonth(-1));
$('nextM').addEventListener('click', () => shiftMonth(1));
function shiftMonth(delta){
  haptic(6);
  const [y,m] = viewMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  const k = monthKey(d);
  if (k > monthKey(new Date())) return;
  viewMonth = k;
  if (editingId) exitEditMode();
  render();
}

/* =========================================================
   17) GOAL
   ========================================================= */
let goalDebounce = null;
let lastSavedGoalValue = null;
$('goalInput').addEventListener('input', () => {
  const v = Number($('goalInput').value);
  if (v > 0) db.goals[viewMonth] = v;
  else delete db.goals[viewMonth];
  cacheLocal();
  renderGoal();
  clearTimeout(goalDebounce);
  goalDebounce = setTimeout(async () => {
    if (lastSavedGoalValue === v) return;
    lastSavedGoalValue = v;
    try{
      await cloudSetGoals(db.goals);
      toast(t('toastGoalSaved'));
    }catch(e){ console.warn('goal save failed', e); }
  }, 500);
});

/* =========================================================
   18) AUTO MONTH SWITCH
   ========================================================= */
function checkMonthRollover(){
  const nowK = monthKey(new Date());
  if (nowK !== knownMonth){
    knownMonth = nowK;
    viewMonth  = nowK;
    if (editingId) exitEditMode();
    $('fDate').value = dateStr(new Date());
    lastGoalReached = false;
    render();
    toast(t('toastMonthChanged', monthLabel(nowK)));
  }
}
setInterval(checkMonthRollover, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkMonthRollover(); });
window.addEventListener('focus', checkMonthRollover);

window.addEventListener('online',  () => { if (firestore) setStatus('online'); toast(t('toastOnline')); });
window.addEventListener('offline', () => setStatus('offline'));

/* =========================================================
   19) TOAST + UNDO
   ========================================================= */
let toastTimer;
function toast(msg){
  const tEl = $('toast');
  tEl.querySelector('.msg').textContent = msg;
  tEl.querySelectorAll('.undo').forEach(u => u.remove());
  tEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => tEl.classList.remove('show'), 2800);
}
function showUndoToast(msg, onUndo){
  const tEl = $('toast');
  tEl.querySelector('.msg').textContent = msg;
  tEl.querySelectorAll('.undo').forEach(u => u.remove());
  const btn = document.createElement('button');
  btn.className = 'undo';
  btn.textContent = LANG === 'en' ? 'Undo' : 'ပြန်ထည့်';
  btn.addEventListener('click', () => { onUndo(); tEl.classList.remove('show'); }, { once:true });
  tEl.appendChild(btn);
  tEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => tEl.classList.remove('show'), 5000);
}

/* =========================================================
   20) CONFETTI
   ========================================================= */
function burstConfetti(){
  const colors = ['#ffd700','#ffe98a','#d4a017','#fff8dc','#c9a227','#f7dc6f'];
  for (let i = 0; i < 70; i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = Math.random() * 0.35 + 's';
    p.style.animationDuration = (1.7 + Math.random() * 1.4) + 's';
    p.style.width = (6 + Math.random() * 6) + 'px';
    p.style.height = (10 + Math.random() * 8) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3400);
  }
}

/* =========================================================
   21) MENU
   ========================================================= */
$('menuBtn').addEventListener('click', e => {
  e.stopPropagation();
  haptic(8);
  $('menu').classList.toggle('open');
});
document.addEventListener('click', e => {
  if (!$('menu').contains(e.target) && !$('menuBtn').contains(e.target)){
    $('menu').classList.remove('open');
  }
});

$('exportBtn').addEventListener('click', () => {
  const data = JSON.stringify({ deviceId, exportedAt: new Date().toISOString(), ...db }, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `jacob-saving-backup-${dateStr(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  $('menu').classList.remove('open');
  toast(t('toastExported'));
  haptic(15);
});

$('importBtn').addEventListener('click', () => { $('fileInput').click(); $('menu').classList.remove('open'); });
$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try{
      const d = JSON.parse(ev.target.result);
      if (!d.entries || !Array.isArray(d.entries)) throw new Error('invalid');
      if (!confirm(t('confirmImport', d.entries.length))) return;
      if (!firestore){ toast(t('toastNoCloud')); return; }

      setStatus('connecting', t('statusImporting'));
      await cloudClearAll();
      const batch = writeBatch(firestore);
      d.entries.forEach(en => {
        const ref = doc(firestore, 'users', deviceId, 'entries', en.id);
        const { id, ...rest } = en;
        batch.set(ref, rest);
      });
      const goalsRef = doc(firestore, 'users', deviceId, 'meta', 'goals');
      batch.set(goalsRef, { data: d.goals || {} });
      await batch.commit();

      toast(t('toastImported'));
      haptic(20);
      setStatus('online');
    }catch(err){
      console.error(err);
      toast(t('toastImportFail'));
      setStatus('online');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

$('syncBtn').addEventListener('click', async () => {
  $('menu').classList.remove('open');
  if (!firestore){ toast(t('toastNoCloud')); return; }
  toast(t('toastResyncing'));
  setStatus('connecting', t('statusResync'));
  try{
    attachEntryListener();
    attachGoalListener();
    setStatus('online');
    toast(t('toastResynced'));
  }catch(e){
    console.error(e);
    setStatus('offline');
  }
});

$('clearBtn').addEventListener('click', async () => {
  $('menu').classList.remove('open');
  if (!confirm(t('confirmClear'))) return;
  if (!firestore){ toast(t('toastNoCloud')); return; }
  try{
    setStatus('connecting', t('statusDeleting'));
    await cloudClearAll();
    db = { entries: [], goals: {} };
    cacheLocal();
    render();
    toast(t('toastCleared'));
    haptic([15,80,15]);
    setStatus('online');
  }catch(e){
    console.error(e);
    toast(t('toastClearFail'));
    setStatus('online');
  }
});

  $('fDate').value = dateStr(new Date());

  applyLanguage();

  setTimeout(() => toast(t('toastWelcome')), 500);
